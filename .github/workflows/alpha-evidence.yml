name: NEXO Alpha | evidências e brandbook

on:
  push:
    branches:
      - feat/homepage-produto-revisao-claude-20261123
    paths:
      - 'homepage/**'
      - 'alpha-snapshot/**'
      - 'design/brandbook-v2/**'
      - '!design/brandbook-v2/NEXO-Alpha-Brandbook-v2.pdf'
      - 'scripts/capture_screens.py'
      - '.github/workflows/alpha-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexo-alpha-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-evidence:
    if: github.repository == 'Zuma-Lab/nexoalpha'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Prepare Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r alpha-snapshot/requirements.txt
          python -m pip install pytest httpx playwright reportlab pillow pypdfium2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "Usando Chrome do runner."
          elif command -v chromium >/dev/null 2>&1; then
            echo "Usando Chromium do runner."
          else
            python -m playwright install chromium
          fi
      - name: Capture actual homepage and workspace V2 in Chromium
        run: python scripts/capture_screens.py
      - name: Build PDF brandbook v2 from canonical Markdown
        run: python design/brandbook-v2/build_brandbook.py
      - name: Verify PDF rendering and create cover preview
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pypdfium2 as pdfium
          target=Path('design/brandbook-v2/NEXO-Alpha-Brandbook-v2.pdf')
          assert target.exists() and target.stat().st_size > 20000, 'PDF ausente ou vazio'
          pdf=pdfium.PdfDocument(str(target))
          assert len(pdf)>=7, f'Brandbook inesperadamente curto: {len(pdf)} páginas'
          out=Path('evidencias/capturas/brandbook-v2-capa.png')
          first=pdf[0].render(scale=1.3).to_pil()
          first.save(out,optimize=True)
          m=Path('evidencias/capturas/manifest.json')
          data=json.loads(m.read_text(encoding='utf-8'))
          data['brandbook_v2']={'path':str(target),'pages':len(pdf),'cover_image':str(out)}
          m.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PDF OK',len(pdf),'páginas; capa renderizada')
          PY
      - name: Upload visual proof (even without commit permission)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-alpha-home-brandbook
          if-no-files-found: warn
          path: |
            evidencias/capturas/*.png
            evidencias/capturas/manifest.json
            design/brandbook-v2/NEXO-Alpha-Brandbook-v2.pdf
      - name: Persist generated assets on the working GitHub branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidencias/capturas/*.png evidencias/capturas/manifest.json design/brandbook-v2/NEXO-Alpha-Brandbook-v2.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs(evidencias): screenshots reais e brandbook PDF regenerados"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Nenhuma alteração nas evidências"
          fi
