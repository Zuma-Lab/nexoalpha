name: NEXO Alpha validation

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  alpha-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API and test dependencies
        run: python -m pip install -r alpha-snapshot/requirements.txt pytest httpx
      - name: Check Python syntax
        run: python -m compileall -q alpha-snapshot/backend
      - name: Test Alpha workflows
        working-directory: alpha-snapshot
        run: python -m pytest -q
      - name: Verify governance IDs, dates, roadmap and tokens
        run: python scripts/validate_governance.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check homepage/dist/app.js
          node --check alpha-snapshot/frontend/app.js
